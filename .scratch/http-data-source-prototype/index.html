<script>
/* PROTOTYPE: Does connection → query → field mapping → object binding feel coherent?
   All state is in memory. No requests, credentials, production modules or storage are used.
   The scene is an SVG spatial illustration, not the production Three.js renderer. */
const PrototypeModel = (() => {
  const connection = () => ({ name:"工厂设备服务",base:"https://api.factory.example/v1",auth:"bearer",credential:"factory-readonly",timeout:10 });
  const query = () => ({ name:"区域水泵最新状态",method:"GET",path:"/pumps/status",area:"A",testArea:"A",strategy:"poll",interval:5,stale:15,readonly:false,body:'{ "areaId": "{areaId}" }',root:"data.items",entity:"deviceCode",label:"name",timestamp:"sampledAt",fields:[{key:"temperature",label:"温度",source:"tempRaw",type:"number",factor:0.1,unit:"℃"},{key:"running",label:"运行状态",source:"run",type:"boolean",factor:1,unit:""}] });
  const binding = (device="pump-01",q=null) => ({ area:q?.area||"A",device,details:q?q.fields.map(f=>f.key):["temperature","running"],color:!q||q.fields.some(f=>["number","boolean"].includes(f.type)),colorField:q?(q.fields.find(f=>f.type==="boolean")||q.fields.find(f=>f.type==="number"))?.key||"":"running",threshold:60,onColor:"#27a686",offColor:"#a8b4c5",enabled:true });
  const initial = () => ({connection:null,query:null,bindings:{},draftConnection:connection(),draftQuery:query(),draftBinding:binding(),modal:null,selected:"pump-a",nav:"data",scenario:"normal",preview:false,runtime:{},test:null,busy:false,testToken:0,requestCount:0,cycle:0,history:[],future:[],alert:"",toast:"",stateOpen:false,details:false,zoom:1,guide:"happy",guideStep:0,sampleText:"",sampleEdit:false,lastAction:"原型已就绪，可从连接开始配置。"});
  const get = (value,path) => path ? path.split(".").reduce((v,k)=>v?.[k],value) : value;
  function mock(area,scenario,cycle,now){
    if(scenario==="error")return {ok:false,status:503,error:"服务暂时不可用 · HTTP 503"};
    if(scenario==="auth")return {ok:false,status:401,error:"凭证失效 · HTTP 401，请修复后重试"};
    const stale=scenario==="stale";
    const items=(area==="B"?[{deviceCode:"pump-03",name:"三号水泵",tempRaw:357,run:1},{deviceCode:"pump-04",name:"四号水泵",tempRaw:399,run:0}]:[{deviceCode:"pump-01",name:"一号水泵",tempRaw:426+(cycle%4)*7,run:cycle%4===3?0:1},{deviceCode:"pump-02",name:"二号水泵",tempRaw:381+(cycle%3)*5,run:0}]).map(item=>({...item,sampledAt:new Date(now-(stale?90000:0)).toISOString()}));
    if(scenario==="missing"){delete items[0].tempRaw;delete items[0].run;}
    if(scenario==="duplicate")items[1].deviceCode=items[0].deviceCode;
    return {ok:true,status:200,body:{code:0,data:{items:scenario==="empty"?[]:items}},receivedAt:now};
  }
  function map(body,q){
    if(body?.code!==0)return {rows:[],errors:["业务成功条件未通过：code 需要等于数字 0。"]};const list=get(body,q.root);if(!Array.isArray(list))return {rows:[],errors:[`数据位置 ${q.root} 不是设备数组，请检查响应位置。`]};
    const ids=new Set(),errors=[];const rows=[];
    for(const item of list){const id=get(item,q.entity);if(typeof id!=="string"||!id){errors.push("设备 ID 必须为非空字符串。");continue;}if(ids.has(id))return {rows:[],errors:[`设备 ID ${id} 重复，本次结果无法确定设备身份。`]};ids.add(id);
      const values={},fieldErrors={};for(const f of q.fields){const v=get(item,f.source);let out=v;
        if(v===undefined||v===null){fieldErrors[f.key]=v===undefined?"字段缺失":"值为 null";continue;}
        if(f.type==="number"){if(typeof v!=="number"||!Number.isFinite(v)){fieldErrors[f.key]="需要有效数值";continue;}out=Number((v*Number(f.factor)).toFixed(4));if(!Number.isFinite(out)){fieldErrors[f.key]="换算系数无效";continue;}}
        if(f.type==="boolean"){if(v===1||v===true)out=true;else if(v===0||v===false)out=false;else{fieldErrors[f.key]="仅接受 1/0 或 true/false";continue;}}
        if(f.type==="string"&&typeof v!=="string"){fieldErrors[f.key]="需要字符串";continue;}values[f.key]=out;
      }
      const ts=q.timestamp?get(item,q.timestamp):null;
      rows.push({id,name:get(item,q.label)||id,values,fieldErrors,observedAt:ts||null});
    }return {rows,errors};
  }
  function cfg(s){return {connection:s.connection,query:s.query,bindings:s.bindings};}
  function record(s){s.history.push(structuredClone(cfg(s)));s.future=[];}
  function reduce(current,action){const s=structuredClone(current);s.alert="";s.toast="";
    const message=(text,error=false)=>{s.toast=text;s.toastError=error;s.lastAction=text;};
    switch(action.type){
      case "FIELD":{const path=action.path.split(".");let target=s;for(const key of path.slice(0,-1))target=target[key];target[path.at(-1)]=action.value;break;}
      case "OPEN":s.modal=action.step;s.alert="";if(action.step==="connection")s.draftConnection=structuredClone(s.connection||s.draftConnection);if(action.step==="query"||action.step==="mapping")s.draftQuery=structuredClone(s.query?{...s.query,testArea:s.draftQuery.testArea||s.query.area}:s.draftQuery);if(action.step==="binding")s.draftBinding=structuredClone(s.bindings[s.selected]||binding(s.selected==="pump-a"?"pump-01":"pump-02",s.query));break;
      case "STEP":if(action.step!=="connection"&&!s.connection){s.alert="请先保存连接，再配置查询。";break;}if(action.step==="binding"&&!s.query){s.alert="请先保存查询和字段映射。";break;}s.modal=action.step;break;
      case "CLOSE":s.modal=null;s.sampleEdit=false;break;
      case "SAVE_CONNECTION":{const c=s.draftConnection;let u;try{u=new URL(c.base);}catch{}if(!c.name.trim()||!u||!["http:","https:"].includes(u.protocol)||u.username||u.password||u.search||u.hash){s.alert="请填写连接名称和有效的服务地址，不含用户信息、查询参数或片段。";break;}if(!Number.isFinite(Number(c.timeout))||Number(c.timeout)<=0){s.alert="超时必须大于 0。";break;}record(s);s.connection=structuredClone(c);s.runtime={};s.test=null;s.modal=action.next?"query":null;message("连接已保存；实际接口将在运行查询时验证。");break;}
      case "TEST_START":s.busy=true;s.testToken++;s.test=null;s.sampleEdit=false;s.lastAction="正在运行一次模拟查询，不产生外部网络请求。";break;
      case "TEST_RESULT":if(action.token!==s.testToken)break;s.busy=false;s.test=action.result;s.test.signature=action.signature;s.test.area=action.area;s.sampleText=action.result.body?JSON.stringify(action.result.body,null,2):"";s.lastAction=action.result.ok?"模拟查询完成，可以检查响应和映射。":action.result.error;break;
      case "CANCEL_TEST":s.busy=false;s.testToken++;message("本次模拟查询已取消。");break;
      case "SAMPLE":s.test={ok:true,status:200,body:mock(s.draftQuery.testArea,"normal",0,action.now).body,receivedAt:action.now,example:true,signature:JSON.stringify(s.draftQuery),area:s.draftQuery.testArea};s.sampleText=JSON.stringify(s.test.body,null,2);s.sampleEdit=false;message("已载入示例 JSON，仅用于当前映射会话。");break;
      case "APPLY_SAMPLE":try{s.test={ok:true,status:200,body:JSON.parse(s.sampleText),receivedAt:action.now,example:true,signature:JSON.stringify(s.draftQuery),area:s.draftQuery.testArea};s.sampleEdit=false;message("示例 JSON 已更新。");}catch{s.alert="JSON 格式不正确，请修正后再应用。";}break;
      case "SAVE_QUERY":{const q=s.draftQuery;if(!s.connection){s.alert="请先保存连接。";break;}if(!q.name.trim()||!q.path.startsWith("/")||q.path.startsWith("//")||q.path.includes("://")){s.alert="请填写查询名称及相对于当前连接的接口路径，例如 /pumps/status。";break;}if(!q.root||!q.entity||!q.fields.length){s.alert="请选择数据位置、设备 ID 和至少一个输出字段。";break;}if(q.method==="POST"&&!q.readonly){s.alert="首期仅演示读取，请确认 POST 接口为只读查询。";break;}if(q.method==="POST"){try{JSON.parse(q.body);}catch{s.alert="POST 请求体需为有效 JSON。";break;}q.strategy="manual";}if(!Number(q.interval)||Number(q.interval)<1||Number(q.stale)<Number(q.interval)){s.alert="轮询间隔至少 1 秒；过期阈值不能小于轮询间隔。";break;}const keys=q.fields.map(f=>f.key);if(keys.some(k=>!k.trim())||new Set(keys).size!==keys.length||q.fields.some(f=>!f.source||!Number.isFinite(Number(f.factor)))){s.alert="属性键须填写且唯一；源字段和换算系数必须有效。";break;}const oldKeys=s.query?.fields.map(f=>f.key)||[];if(Object.keys(s.bindings).length&&s.query&&(JSON.stringify(oldKeys)!==JSON.stringify(keys)||s.query.fields.some((f,i)=>f.type!==q.fields[i]?.type))){s.alert="属性键或类型已被对象引用，请先解除绑定再修改；显示名与系数可以直接调整。";break;}record(s);s.query=structuredClone(q);delete s.query.testArea;s.runtime={};s.modal=action.next?"binding":null;s.draftBinding=structuredClone(s.bindings[s.selected]||binding(s.selected==="pump-a"?"pump-01":"pump-02",s.query));message("查询与字段映射已保存，实时结果仍保留在会话中。");break;}
      case "ADD_FIELD":s.draftQuery.fields.push({key:"pressure",label:"压力",source:"tempRaw",type:"number",factor:1,unit:"kPa"});break;
      case "REMOVE_FIELD":s.draftQuery.fields.splice(action.index,1);break;
      case "SAVE_BINDING":{if(!s.query){s.alert="请先创建并保存查询。";break;}const b=s.draftBinding;if(!b.device.trim()||!b.area.trim()){s.alert="请填写设备 ID 与区域参数。";break;}if(!b.details.length&&!b.color){s.alert="至少选择一个详情字段或启用颜色规则。";break;}if(b.details.some(key=>!s.query.fields.some(f=>f.key===key))){s.alert="详情字段已变化，请重新选择当前查询中的字段。";break;}if(b.color&&!s.query.fields.some(f=>f.key===b.colorField)){s.alert="颜色属性不在当前查询中，请重新选择。";break;}record(s);s.bindings[s.selected]=structuredClone(b);s.modal=null;s.runtime={};message("对象绑定已保存，开启数据预览即可查看效果。");break;}
      case "SELECT":s.selected=action.id;if(s.preview)s.details=true;s.lastAction=`已选择${action.id==="pump-a"?"水泵模型 A":"水泵模型 B"}。`;break;
      case "NAV":s.nav=action.value;break;
      case "TOGGLE_PREVIEW":if(s.preview){s.preview=false;s.runtime={};s.details=false;message("预览已停止，所有对象恢复原始外观。");}else if(!s.query||!Object.values(s.bindings).some(b=>b.enabled)){message("请先保存查询，并为至少一个对象添加绑定。",true);}else{s.preview=true;s.runtime={};s.details=true;message("数据预览已开启；相同查询及参数共享一次模拟请求。");}break;
      case "RUNTIME_START":s.requestCount+=action.count;s.lastAction=`执行 ${action.count} 个共享模拟请求。`;break;
      case "RUNTIME_RESULT":if(!s.preview)break;s.runtime=action.results;s.cycle++;s.lastAction="实时展示已更新；模拟结果未写入配置。";break;
      case "SCENARIO":s.scenario=action.value;s.lastAction="模拟场景已切换，下一次查询将使用该场景。";break;
      case "TOGGLE_BINDING":if(!s.bindings[s.selected])break;record(s);s.bindings[s.selected].enabled=!s.bindings[s.selected].enabled;break;
      case "UNBIND":record(s);delete s.bindings[s.selected];s.runtime={};message("当前对象已解除绑定，配置可撤销。");break;
      case "UNBIND_ALL":record(s);s.bindings={};s.preview=false;s.runtime={};s.details=false;message("两个对象均已解除绑定，查询现在可以删除。");break;
      case "DELETE_QUERY":if(Object.keys(s.bindings).length){message(`查询被 ${Object.keys(s.bindings).length} 个对象引用，请先解除或调整绑定。`,true);}else{record(s);s.query=null;s.test=null;message("查询已删除，连接保留。");}break;
      case "DELETE_CONNECTION":if(s.query){message("连接仍有 1 个查询引用，请先处理查询及其对象绑定。",true);}else{record(s);s.connection=null;message("连接已删除。");}break;
      case "UNDO":if(s.history.length){s.future.push(structuredClone(cfg(s)));Object.assign(s,s.history.pop());s.preview=false;s.runtime={};s.details=false;message("已撤销配置编辑，预览保持停止。");}break;
      case "REDO":if(s.future.length){s.history.push(structuredClone(cfg(s)));Object.assign(s,s.future.pop());s.preview=false;s.runtime={};s.details=false;message("已重做配置编辑，预览保持停止。");}break;
      case "DEMO":s.connection=connection();s.query=query();delete s.query.testArea;s.draftQuery=query();s.bindings={"pump-a":binding("pump-01"),"pump-b":binding("pump-02")};s.preview=false;s.runtime={};s.test=null;s.details=false;s.history=[];s.future=[];s.modal=null;s.scenario="normal";s.guideStep=0;message("已载入完整演示配置：两个对象共享一个区域查询。");break;
      case "RESET":return initial();
      case "GUIDE":s.guide=action.value;s.guideStep=0;break;
      case "GUIDE_NEXT":s.guideStep++;break;
      case "DETAILS":s.details=action.value;break;
      case "STATE":s.stateOpen=!s.stateOpen;break;
      case "ZOOM":s.zoom=Math.max(.7,Math.min(1.3,s.zoom+action.delta));break;
    }return s;
  }
  return {initial,reduce,mock,map,cfg,get};
})();

<script>
let state=PrototypeModel.initial(),toastTimer,requestTimer,runtimeToken=0,runtimeBusy=false;
const e=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icons={data:'<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v13c0 4 14 4 14 0V5M5 11c0 4 14 4 14 0"/>',cube:'<path d="m12 2 9 5v10l-9 5-9-5V7Zm0 0v10m-9-5 9 5 9-5m-9 5v10"/>',plug:'<path d="M9 2v5m6-5v5M6 7h12v4a6 6 0 0 1-12 0V7Zm6 10v5"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',play:'<path d="m8 5 11 7-11 7Z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',check:'<path d="m5 12 4 4L19 6"/>',refresh:'<path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/>',gear:'<path d="m9 3 1-2h4l1 2 3 2 2 1v4l-2 1v3l2 1v4l-3 1-2 2h-5l-1-2-3-1-2-3 1-2v-3l-1-2 2-3Z"/><circle cx="12" cy="12" r="3"/>',link:'<path d="m9 15 6-6m-6-3 2-2a5 5 0 0 1 7 7l-2 2M8 11l-2 2a5 5 0 0 0 7 7l2-2"/>',undo:'<path d="M9 5 3 11l6 6M3 11h11a6 6 0 0 1 6 6"/>',redo:'<path d="m15 5 6 6-6 6m6-6H10a6 6 0 0 0-6 6"/>',pointer:'<path d="m5 3 14 9-7 2-3 7Z"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',file:'<path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8m-8 4h6"/>',layers:'<path d="m2 7 10-5 10 5-10 5ZM2 12l10 5 10-5M2 17l10 5 10-5"/>'};
function icon(name,size=17){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.cube}</svg>`;}
function button(label,action,cls="",extras=""){return `<button type="button" class="${cls}" data-action="${action}" ${extras}>${label}</button>`;}
function input(label,path,value,type="text",extra=""){return `<label class="field"><span>${label}</span><input type="${type}" data-field="${path}" value="${e(value)}" ${extra}></label>`;}
function select(label,path,value,options){return `<label class="field"><span>${label}</span><select data-field="${path}">${options.map(([v,l])=>`<option value="${e(v)}" ${String(v)===String(value)?"selected":""}>${e(l)}</option>`).join("")}</select></label>`;}

function dispatch(type,rest={}){const previousPreview=state.preview,previousConfig=JSON.stringify(PrototypeModel.cfg(state));state=PrototypeModel.reduce(state,{type,...rest});if(!state.preview||!previousPreview||previousConfig!==JSON.stringify(PrototypeModel.cfg(state))){runtimeToken++;runtimeBusy=false;clearTimeout(requestTimer);}render();if(state.toast){clearTimeout(toastTimer);toastTimer=setTimeout(()=>{document.querySelector("#toast-root").innerHTML="";},4500);} }
function selectedName(){return state.selected==="pump-a"?"水泵模型 A":"水泵模型 B";}

function currentSample(id=state.selected){const b=state.bindings[id];if(!state.preview||!b?.enabled)return {status:"idle",label:b?.enabled===false?"绑定已停用":"预览未开启"};const r=state.runtime[contextKey(b.area)];if(!r)return {status:"loading",label:"正在获取数据"};if(!r.ok)return {status:"error",label:r.error};const mapped=PrototypeModel.map(r.body,state.query);if(mapped.errors.length)return {status:"error",label:mapped.errors[0]};const row=mapped.rows.find(x=>x.id===b.device);if(!row)return {status:"empty",label:"本次未返回该设备"};const stale=Date.now()-r.receivedAt>Number(state.query.stale)*1000||(row.observedAt&&Date.now()-Date.parse(row.observedAt)>Number(state.query.stale)*1000);if(stale)return {status:"stale",label:"数据已过期",row,result:r};return {status:Object.keys(row.fieldErrors).length?"partial":"good",label:Object.keys(row.fieldErrors).length?"部分字段不可用":"数据有效",row,result:r};}
function pumpColor(id){const s=currentSample(id),b=state.bindings[id];if(!["good","partial"].includes(s.status)||!b?.color||s.row.fieldErrors[b.colorField])return "#8dacc8";const v=s.row.values[b.colorField];return typeof v==="number"?(v>=Number(b.threshold)?b.onColor:b.offColor):(v===true?b.onColor:b.offColor);}
function guideInfo(){if(state.guide==="happy"){if(!state.connection)return ["01 / 05 · 配置服务连接","先定义可复用的服务地址与认证，再创建具体接口。","配置连接","open-connection",0];if(!state.query){if(state.test?.ok)return ["03 / 05 · 定义业务字段","将原始 JSON 适配成设备身份、温度和运行状态。","配置字段映射","open-mapping",2];return ["02 / 05 · 创建并测试查询","请求参数、测试值与后续对象绑定参数分别管理。","配置查询","open-query",1];}if(!Object.keys(state.bindings).length)return ["04 / 05 · 将数据绑定到对象","选一个设备，再决定显示字段与状态颜色。","配置对象绑定","open-binding",3];return state.preview?["完整流程已跑通","试着点击另一台水泵，或模拟异常观察数据与颜色的变化。","停止数据预览","preview",5]:["05 / 05 · 开启数据预览","只保存规则；实时数据在预览期间获取和展示。","开启数据预览","preview",4];}
    if(state.guide==="errors"){const steps=[["异常与恢复 · 准备","载入两个已绑定对象，观察它们如何共享一次查询。","载入并预览","guide-errors-start"],["异常与恢复 · 请求失败","模拟 HTTP 503，观察提示与对象颜色回退。","模拟请求失败","guide-error"],["异常与恢复 · 重新连接","恢复正常结果，绑定配置无需重新填写。","恢复正常数据","guide-recover"],["异常与恢复 · 数据过期","接口正常响应，但采样时间为 90 秒前。","模拟数据过期","guide-stale"],["异常与恢复 · 字段缺失","仅第一台设备缺少温度与运行字段，第二台继续可用。","模拟字段缺失","guide-missing"],["异常与恢复 · 完成","可以自由切换右侧模拟场景，继续查看不同状态。","恢复正常数据","guide-recover"]];return [...steps[Math.min(state.guideStep,5)],state.guideStep];}
    const steps=[["引用保护 · 准备","载入连接、查询与两个对象绑定。","载入演示配置","guide-guard-start"],["引用保护 · 尝试删除","查询仍被两个对象使用，删除应该被阻止。","尝试删除查询","guide-guard-delete"],["引用保护 · 解除引用","解除两个演示绑定，连接与查询仍然保留。","解除演示绑定","guide-unbind"],["引用保护 · 删除查询","现在查询没有对象引用，可以独立删除。","删除查询","guide-delete-query"],["引用保护 · 完成","连接仍保留；配置编辑可通过撤销恢复。","撤销删除","undo"]];return [...steps[Math.min(state.guideStep,4)],state.guideStep];}
function render(){const focused=document.activeElement,focusPath=focused?.dataset?.field,focusSelection=focused?.selectionStart,oldDialog=document.querySelector(".dialog-content"),oldScroll=oldDialog?.scrollTop||0;const g=guideInfo(),sample=currentSample();document.querySelector("#app").innerHTML=`<main class="app">
  <header class="topbar"><div class="logo">ek</div><span class="brand">AIoT Studio</span><span class="topsep"></span><span class="projectname">泵站数字孪生 <span class="muted">/ 数据接入</span></span><span class="badge amber">交互原型</span><span class="muted tiny prototype-caption">模拟数据 · 不连接真实服务 · 刷新重置</span><div class="topright">${button("重新开始","reset","quiet small optional")}${button("载入完整演示","demo","quiet small optional")}${button(icon("undo"),"undo","icon",`aria-label="撤销配置编辑" ${!state.history.length?"disabled":""}`)}${button(icon("redo"),"redo","icon",`aria-label="重做配置编辑" ${!state.future.length?"disabled":""}`)}${button(`${icon(state.preview?"stop":"play",13)} ${state.preview?"停止预览":"数据预览"}`,"preview",`row ${state.preview?"primary":""}`)}<div class="avatar">EK</div></div></header>
  <section class="guidebar" aria-label="交互流程引导"><div class="guide-icon">${icon("link")}</div><div><div class="eyebrow">FLOW WALKTHROUGH</div><div class="guide-tabs">${["happy","errors","guard"].map((v,i)=>button(["完整接入","异常与恢复","引用保护"][i],`guide-${v}`,state.guide===v?"active":"")).join("")}</div></div><div class="guide-message"><b>${g[0]}</b><p>${g[1]}</p><div class="steptrack">${Array.from({length:5},(_,i)=>`<i class="${i<g[4]?"done":""}"></i>`).join("")}</div></div>${button(`${g[2]} <span aria-hidden="true">→</span>`,g[3],"small guide-action")}</section>

function renderSidebar(){return `<div class="side-heading"><h3>${state.nav==="data"?"数据源管理":"场景层级"}</h3>${button(icon("plus",15),state.nav==="data"?"open-connection":"open-binding","icon",'aria-label="添加数据连接或绑定"')}</div>${state.nav==="data"?`<input class="search" placeholder="搜索连接或查询" aria-label="搜索数据源" id="source-search"><div class="sectionlabel">当前场景的连接 <span class="muted">${state.connection?"01":"00"}</span></div><div id="source-list">${state.connection?`<div class="connection-card"><div class="row"><span style="color:#6b8ac1">${icon("plug",16)}</span><span class="conn-title">${e(state.connection.name)}</span></div><p class="host">${e(state.connection.base)}</p><div class="row between" style="margin-top:11px"><span class="badge ${state.test?.ok&&!state.test.example?"green":""}">${state.test?.ok&&!state.test.example?"最近测试通过":"配置已保存"}</span>${button("编辑","open-connection","quiet small")}</div>${state.query?`<div class="query-card" data-action="open-query" role="button" tabindex="0"><div class="row"><span class="badge blue">${state.query.method}</span><p>${e(state.query.name)}</p></div><div class="meta">${state.query.fields.length} 个属性 · ${Object.keys(state.bindings).length} 个引用</div></div>`:button("＋ 创建第一个查询","open-query","outline-dash")}</div>`:`<div class="empty"><div class="empty-orb">${icon("data",22)}</div><strong>让场景连接业务数据</strong><p class="tiny" style="margin:9px 0 16px">配置一次服务连接<br>在多个对象间复用设备数据</p>${button("＋ 新建连接","open-connection","primary small")}</div>`}</div>${state.connection&&state.query?button("编辑字段映射","open-mapping","outline-dash"):""}<div class="aside-bottom"><span class="eyebrow">配置链路</span><div style="margin-top:9px">${state.connection?"✓":"○"} 服务连接<br>${state.query?"✓":"○"} 接口查询与字段映射<br>${Object.keys(state.bindings).length?"✓":"○"} 3D 对象绑定</div></div>`:""}<div class="sectionlabel" style="margin-top:24px">场景对象</div>${["pump-a","pump-b"].map((id,i)=>`<div class="object-item ${state.selected===id?"active":""}" data-action="select-${id}" role="butt function renderInspector(){const b=state.bindings[state.selected],s=currentSample();return `<div class="inspect-header"><div class="inspect-tabs"><span class="active">对象</span><span>环境</span><span>场景</span></div><div class="row"><div class="object-icon">${icon("cube",20)}</div><div><h3 style="font-size:12px">${selectedName()}</h3><p class="mono tiny muted" style="margin-top:4px">${state.selected} · object</p></div></div></div><section class="inspect-section"><div class="title">变换 <span class="badge" style="margin-left:auto">${state.preview?"预览中只读":"场景示意"}</span></div>${["位置","旋转","缩放"].map((label,i)=>`<div class="property-line"><span>${label}</span>${["X","Y","Z"].map((a,j)=>`<span class="fakeinput">${a} <b>${i===2?"1.0":i===0&&j===0?(state.selected==="pump-a"?"−1.5":"1.5"):"0.0"}</b></span>`).join("")}</div>`).join("")}</section><section class="inspect-section"><div class="title">${icon("link",14)} 数据绑定 ${b?`<span class="badge blue" style="margin-left:auto">${b.enabled?"已配置":"已停用"}</span>`:""}</div>${b?`<div class="binding-summary"><dl style="margin:0"><dt>查询</dt><dd>${e(state.query?.name)}</dd><dt>设备 / 参数</dt><dd><span class="mono">${e(b.device)}</span> <span class="muted">· 区域 ${e(b.area)}</span></dd><dt>数据详情</dt><dd>${b.details.map(key=>`<span class="field-pill">${e(state.query?.fields.find(f=>f.key===key)?.label||key)}</span>`).join("")}</dd></dl>${b.color?`<div class="row tiny" style="margin-top:11px;color:#8193ac"><span class="dot" style="background:${e(b.onColor)}"></span>状态颜色 <span style="margin-left:auto">${e(b.colorField)}</span></div>`:""}</div><div class="inspector-actions">${button("编辑绑定","open-binding","grow")}${button(b.enabled?"停用":"启用","toggle-binding")}${button("解除","unbind","danger")}</div><div class="note ${["error","partial","stale","empty"].includes(s.status)?"warn":""}" style="margin-top:13px;font-size:10px">${e(s.label)}${s.status==="idle"?"。开启预览后获取当前值。":""}</div>`:`<div class="empty" style="padding:12px 0 5px"><p class="tiny" style="margin- function displayValue(value,f){if(value===undefined||value===null)return "—";if(typeof value==="boolean")return f.key==="running"?(value?"运行":"停止"):(value?"是":"否");return typeof value==="number"?value.toFixed(1):String(value);}
function renderDetails(){const b=state.bindings[state.selected],sample=currentSample(),fields=state.query?.fields.filter(f=>b?.details.includes(f.key))||[];return `<div class="scene-card"><div class="row between"><span class="eyebrow">LIVE DEVICE DATA</span>${button("×","hide-details","quiet small",'aria-label="关闭设备详情"')}</div><h3 style="margin-top:8px">${selectedName()}</h3><p class="mono tiny muted" style="margin-top:5px">${b?e(b.device):"尚未绑定设备"}</p>${sample.row?`${fields.map((f,i)=>`<div class="fieldvalue row between" style="margin-top:15px"><span class="muted tiny">${e(f.label||f.key)}</span><b style="font-size:${i===0?"25":"13"}px">${e(displayValue(sample.row.values[f.key],f))}<small class="muted" style="font-size:11px"> ${e(f.unit)}</small></b></div>${sample.row.fieldErrors[f.key]?`<p class="inline-note" style="color:#bd6666">${e(sample.row.fieldErrors[f.key])}</p>`:""}`).join("")}<div class="divider" style="margin-top:16px"></div><div class="tiny muted" style="line-height:1.9;margin-top:9px">源采样 ${time(sample.row.observedAt)}<br>接收时间 ${time(sample.result?.receivedAt)}</div>`:`<p class="muted tiny" style="padding:20px 0">${e(sample.label)}</p>`}<span class="badge ${sample.status==="good"?"green":["stale","partial","error","empty"].includes(sample.status)?"amber":""}" style="margin-top:12px">${e(sample.label)}</span>${sample.status==="stale"?'<p class="inline-note" style="margin-top:8px">过期样本，仅供参考；对象已恢复原色。</p>':""}<p class="inline-note" style="margin-top:7px">源质量未提供 · 模拟数据</p></div>`;}

function renderModal(){const root=document.querySelector("#modal-root");if(!state.modal){root.innerHTML="";return;}const step=state.modal;const titles={connection:["配置服务连接","定义可复用的服务地址。认证由宿主提供，项目只保存凭证引用。"],query:["配置接口查询","先运行一次查询，检查原始响应。测试值不会修改查询默认参数。"],mapping:["把响应映射为业务属性","选择设备身份与字段，再检查类型、换算和实际输出。"],binding:["将设备数据绑定到对象","选择查询与设备，为对象配置数据详情和状态颜色。"]};
 root.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><nav class="dialog-nav"><div class="dialog-brand"><div class="logo" style="width:27px;height:27px;font-size:12px">ek</div>数据接入配置</div>${["connection","query","mapping","binding"].map((k,i)=>`<button class="step-button ${k===step?"active":""} ${(i===0&&state.connection)||(i<3&&state.query)||(i===3&&Object.keys(state.bindings).length)?"done":""}" data-action="step-${k}"><span class="step-n">${i+1}</span><span class="step-copy"><b>${["服务连接","接口查询","字段映射","对象绑定"][i]}</b><small>${["地址与认证","请求与参数","身份与业务属性","设备与展示规则"][i]}</small></span></button>`).join("")}<div class="dialog-nav-bottom"><span class="badge amber">PROTOTYPE</span><p style="margin-top:11px">流程与状态体验原型<br>所有操作仅在内存中生效<br>关闭或刷新后重置</p></div></nav><div class="dialog-main"><header class="dialog-header"><div class="row between"><div><div class="eyebrow" style="margin-bottom:7px">DATA CONNECTION / STEP ${["connection","query","mapping","binding"].indexOf(step)+1}</div><h2 id="dialog-title">${titles[step][0]}</h2></div>${button(icon("close",18),"close","quiet icon",'aria-label="关闭配置窗口"')}</div><p>${titles[step][1]}</p></header><div class="dialog-content">${state.alert?`<div class="note error dialog-alert" role="alert">${e(state.alert)}</div>`:""}${step==="connection"?connectionForm():step==="query"?queryForm():step==="mapping"?mappingForm():bindingForm()}</div>${modalFooter()}</div></section></div>`;

function responsePanel(q){const t=state.test,old=t&&t.signature!==JSON.stringify(q);return `<aside class="response-panel"><div class="response-top">${icon("file",14)}<b class="grow">原始响应</b>${state.busy?'<span class="badge blue">模拟请求中</span>':t?`<span class="badge ${t.ok?"green":"red"}">${t.status?`HTTP ${t.status}`:"执行失败"}</span>`:'<span class="badge">尚未执行</span>'}</div>${t?.ok?`<pre>${e(JSON.stringify(t.body,null,2))}</pre>`:`<div class="empty" style="padding:37px 16px"><div class="empty-orb">${icon("file",21)}</div><p class="tiny">${state.busy?"正在等待模拟服务响应…":t?e(t.error):"运行查询后，在这里查看原始 JSON"}</p></div>`}<div class="result-meta">${t?.ok?`${t.example?"示例 JSON":"内存模拟结果"} · ${time(t.receivedAt)}<br>${old?'<span style="color:#bd8b38">配置已改变，此结果尚未重新验证</span>':"仅测试一次，不启动持续轮询"}`:"测试结果仅保留在当前会话中"}</div></aside>`;}

function bindingForm(){const b=state.draftBinding,q=state.query;if(!q)return `<div class="empty"><strong>先创建一个可用查询</strong><p class="tiny" style="margin:10px 0 18px">保存查询与字段映射后，即可选择设备和展示字段。</p>${button("创建查询","open-query","primary")}</div>`;return `<div class="binding-layout"><div class="stack"><div class="source-row"><span class="row">${icon("cube",17)}<b>${selectedName()}</b></span><span class="badge">${state.selected}</span></div><label class="field"><span>选择查询 <em>*</em></span><select aria-label="选择查询"><option>${e(q.name)} · ${e(state.connection.name)}</option></select></label>${select("绑定参数 · areaId","draftBinding.area",b.area,[["A","A · 使用区域 A"],["B","B · 覆盖为区域 B"]])}<p class="inline-note" style="margin-top:-9px">查询默认值：${e(q.area)}。仅覆盖当前对象的参数。</p>${input("设备 ID <em>*</em>","draftBinding.device",b.device,"text",'list="device-choices"')}<datalist id="device-choices">${(b.area==="B"?["pump-03","pump-04"]:["pump-01","pump-02"]).map(v=>`<option value="${v}">`).join("")}</datalist><div class="form-section">数据详情 · 点击对象时展示</div>${q.fields.map(f=>`<label class="checkrow"><input type="checkbox" data-detail="${e(f.key)}" ${b.details.includes(f.key)?"checked":""}>${e(f.label||f.key)}${f.unit?` · ${e(f.unit)}`:""}</label>`).join("")}<div class="divider"></div>${check("启用状态颜色","draftBinding.color",b.color)}${b.color?`${select("颜色依据","draftBinding.colorField",b.colorField,q.fields.filter(f=>["boolean","number"].includes(f.type)).map(f=>[f.key,`${f.label} · ${f.key}`]))}${b.colorField==="running"?`<div class="rule-row"><span class="tiny muted">运行 · true</span><span class="tiny muted">使用颜色</span><input type="color" aria-label="运行颜色" data-field="draftBinding.onColor" value="${e(b.onColor)}"></div><div class="rule-row"><span class="tiny muted">停止 · false</span><span class="tiny muted">使用颜色</span><input type="color" aria-label="停止颜色" data-field="draftBinding.offColor" value="${e(b.offColor)}"></div>`:`<div class="rule-row"><span class="tiny muted">数值 ≥ 阈值</span><input type="numbe function runTest(){if(!state.connection){dispatch("STEP",{step:"query"});return;}if(!state.draftQuery.testArea.trim()){state.alert="请填写本次测试区域。";render();return;}dispatch("TEST_START");const token=state.testToken;const captured=structuredClone({q:state.draftQuery,c:state.connection,scenario:state.scenario});setTimeout(()=>{const invalidCredential=captured.c.auth!=="none"&&!captured.c.credential;const result=invalidCredential?{ok:false,status:401,error:"尚未提供宿主凭证，配置仍可保存。"}:PrototypeModel.mock(captured.q.testArea,captured.scenario,0,Date.now());dispatch("TEST_RESULT",{token,result,signature:JSON.stringify(captured.q),area:captured.q.testArea});},650);}

});
document.addEventListener("input",event=>{const t=event.target;if(t.id==="source-search"){const list=document.querySelector("#source-list");if(list)list.style.display=list.textContent.toLowerCase().includes(t.value.toLowerCase())?"":"none";return;}if(t.dataset.detail){const key=t.dataset.detail;state=PrototypeModel.reduce(state,{type:"FIELD",path:"draftBinding.details",value:t.checked?[...new Set([...state.draftBinding.details,key])]:state.draftBinding.details.filter(v=>v!==key)});const preview=document.querySelector("#binding-preview");if(preview)preview.innerHTML=bindingPreview();return;}if(!t.dataset.field)return;const path=t.dataset.field;state=PrototypeModel.reduce(state,{type:"FIELD",path,value:t.type==="checkbox"?t.checked:t.value});if(path.startsWith("draftQuery")){const url=document.querySelector("#request-url");if(url)url.textContent=requestUrl(state.draftQuery);const p=document.querySelector("#mapping-preview");if(p)p.innerHTML=mappingPreview();}if(path.startsWith("draftBinding")){const p=document.querySelector("#binding-preview");if(p)p.innerHTML=bindingPreview();}renderState();});
document.addEventListener("change",event=>{const t=event.target;if(!t.dataset.field)return;if(t.tagName==="SELECT"||t.type==="checkbox"){if(t.dataset.field==="draftQuery.method"&&t.value==="POST")state.draftQuery.strategy="manual";render();if(t.dataset.field==="scenario"&&state.preview){runtimeToken++;runtimeBusy=false;runRuntime();}}});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(state.stateOpen)dispatch("STATE");else if(state.modal)dispatch("CLOSE");}if(event.target.matches('[role="button"][data-action]')&&(event.key==="Enter"||event.key===" ")){event.preventDefault();event.target.click();}if(state.modal&&event.key==="Tab"){const dialog=document.querySelector(".dialog"),items=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}}});
setInterval(()=>{if(!state.preview||!state.query)return;const results=Object.values(state.runtime);if(state.query.strategy==="poll"&&!results.some(r=>r.status===401)){const latest=Math.max(0,...results.map(r=>r.receivedAt||0));if(Date.now()-latest>=Number(state.query.interval)*1000)runRuntime();}const oldRows=Object.keys(state.bindings).map(id=>currentSample(id).status).join();if(oldRows.includes("stale")&&!state.modal)render();},1000);
render();
</script>
</body>
</html>
